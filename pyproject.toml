[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pyobf"
version = "0.1.0-alpha"
description = "纯标准库的 Python 代码混淆器（CLI，AST 方式）"
requires-python = ">=3.9"
license = { text = "MIT" }

[project.scripts]
pyobf = "pyobf.cli:main"

[tool.setuptools]
packages = ["pyobf"]
